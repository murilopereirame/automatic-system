# Runs on every pull request (including stacked ones) and on main.
# Make both jobs required status checks on main to block merging when they fail.
# The image is built and smoke-tested on linux/amd64 and linux/arm64, each on a runner of that
# architecture. On main, the two images that passed are published to GitHub Container Registry
# under one multi-architecture tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Build and smoke-test the container image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      AUTOWORKER_IMAGE: autoworker:ci
      AUTOWORKER_TOKEN: ci-token
      AUTOWORKER_SECRET_KEY: ci-secret-key
      AUTOWORKER_GATEWAY_SECRET: ci-gateway-secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.AUTOWORKER_IMAGE }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Start it with the hardened compose file
        run: docker compose up --detach --no-build

      # The smoke test needs the `ws` package from the repository's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check the sandbox from the inside
        run: node docker/smoke-test.mjs http://localhost:8080 "$AUTOWORKER_TOKEN"

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under a tag of its own. The publish job below joins both architectures.
      - name: Push the image for this architecture
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}

  publish:
    name: Publish the multi-architecture image
    if: github.event_name == 'push'
    needs: [test, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag that points at both images. Docker picks the one matching the host.
      - name: Join both architectures under one tag
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:${{ github.sha }}" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
